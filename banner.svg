<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#05080a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#05080a" stop-opacity="0.92"/>
    </linearGradient>

    <pattern id="commitGrid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="0"  y="0"  width="15" height="15" rx="3" fill="#0d1b1e"/>
      <rect x="20" y="0"  width="15" height="15" rx="3" fill="#146e7a"/>
      <rect x="40" y="0"  width="15" height="15" rx="3" fill="#0d1b1e"/>
      <rect x="60" y="0"  width="15" height="15" rx="3" fill="#1fa7b8"/>
      <rect x="0"  y="20" width="15" height="15" rx="3" fill="#123a40"/>
      <rect x="20" y="20" width="15" height="15" rx="3" fill="#0d1b1e"/>
      <rect x="40" y="20" width="15" height="15" rx="3" fill="#00d4e8"/>
      <rect x="60" y="20" width="15" height="15" rx="3" fill="#123a40"/>
      <rect x="0"  y="40" width="15" height="15" rx="3" fill="#146e7a"/>
      <rect x="20" y="40" width="15" height="15" rx="3" fill="#5df2ff"/>
      <rect x="40" y="40" width="15" height="15" rx="3" fill="#0d1b1e"/>
      <rect x="60" y="40" width="15" height="15" rx="3" fill="#123a40"/>
      <rect x="0"  y="60" width="15" height="15" rx="3" fill="#0d1b1e"/>
      <rect x="20" y="60" width="15" height="15" rx="3" fill="#146e7a"/>
      <rect x="40" y="60" width="15" height="15" rx="3" fill="#1fa7b8"/>
      <rect x="60" y="60" width="15" height="15" rx="3" fill="#0d1b1e"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#commitGrid)" opacity="0.9"/>
  <rect width="1000" height="260" fill="url(#fade)"/>

  <text x="50%" y="46%" text-anchor="middle" font-family="'Courier New', monospace" font-size="58" font-weight="700" fill="#00e5ff" stroke="#ffffff" stroke-width="1">Jean Brito</text>
  <text x="50%" y="62%" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#8ee9f5" letter-spacing="1">Building Modern Web Applications</text>
</svg>
